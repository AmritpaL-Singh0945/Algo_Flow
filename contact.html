<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOFLOW | CONTACT</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
    <script src="js/app/theme.js"></script>
    <script src="js/app/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="./index.html" class="logo-link" style="text-decoration:none;">
            <div class="logo">ALGOFLOW</div>
        </a>
        <div class="nav-links">
            <a href="engine.html">ENGINE</a>
            <a href="contact.html">CONTACT</a>
            <a href="about.html">ABOUT</a>
            <a href="login.html" id="auth-link">LOGIN</a>
            <button id="theme-toggle">🌙 DARK</button>
        </div>
    </nav>

    <main class="contact-wrapper">
        <div class="bento-card contact-card" style="padding: 50px;">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">Get in Touch</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem;">
                Reach out for collaboration, questions, or bug reports.
            </p>
            
            <form class="brutal-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" class="brutal-input" placeholder="Amritpal Singh" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="brutal-input" placeholder="hello@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="brutal-textarea" rows="5" placeholder="How can I help you?" required></textarea>
                </div>
                
                <button type="submit" class="brutal-btn primary" style="width: 100%; margin-top: 10px; border-radius: 50px; padding: 14px;">SEND MESSAGE</button>
            </form>
        </div>
    </main>
</body>
</html>
