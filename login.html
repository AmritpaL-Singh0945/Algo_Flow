<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOFLOW | LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
    <script src="js/app/theme.js"></script>
    <script src="js/app/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="./index.html" class="logo-link" style="text-decoration:none;">
            <div class="logo">ALGOFLOW</div>
        </a>
        <div class="nav-links">
            <a href="engine.html">ENGINE</a>
            <a href="contact.html">CONTACT</a>
            <a href="about.html">ABOUT</a>
            <a href="login.html" id="auth-link">LOGIN</a>
            <button id="theme-toggle">🌙 DARK</button>
        </div>
    </nav>

    <main class="contact-wrapper">
        <div class="bento-card contact-card" style="padding: 50px; text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">Welcome Back</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem;">
                Sign in to continue to your dashboard.
            </p>
            
            <form class="brutal-form" id="login-form" style="text-align: left;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="brutal-input" placeholder="hello@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" class="brutal-input" placeholder="••••••••" style="margin-bottom: 0; padding-right: 40px;" required>
                        <span class="password-toggle" onclick="togglePassword('password', this)" style="position: absolute; right: 15px; cursor: pointer; color: var(--text-muted);">👁️</span>
                    </div>
                </div>
                
                <div id="login-error" style="color: var(--accent-red); font-size: 0.9rem; font-weight: 700; display: none;"></div>
                
                <button type="submit" class="brutal-btn primary" style="width: 100%; margin-top: 10px; border-radius: 50px; padding: 14px;">SIGN IN</button>
                
                <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
                    Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">Sign up</a>
                </p>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            const users = JSON.parse(localStorage.getItem('mock_users') || '{}');
            
            if (users[email]) {
                const isValid = typeof users[email] === 'string' ? users[email] === password : users[email].password === password;
                if (isValid) {
                    const token = generateFakeJWT(email);
                    localStorage.setItem('auth_token', token);
                    const name = typeof users[email] === 'string' ? email.split('@')[0] : users[email].name;
                    localStorage.setItem('login_toast', `Welcome back, ${name}!`);
                    window.location.href = 'engine.html';
                    return;
                }
            }
            
            errorDiv.textContent = "Invalid email or password.";
            errorDiv.style.display = "block";
        });
    </script>
</body>
</html>
