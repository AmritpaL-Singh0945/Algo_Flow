<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOFLOW | ARRAYS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/arrays.css">
    <script src="js/app/theme.js"></script>
    <script src="js/app/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="./index.html" class="logo-link">
            <div class="logo">ALGOFLOW</div>
        </a>
        <div class="nav-links">
            <a href="engine.html">ENGINE</a>
            <a href="contact.html">CONTACT</a>
            <a href="about.html">ABOUT</a>
            <a href="login.html" id="auth-link">LOGIN</a>
            <button id="theme-toggle">🌙 DARK</button>
        </div>
    </nav>

    <main class="bento-grid arrays-layout">
        <div class="bento-card controls-card">
            <h2>ARRAY ENGINE</h2>
            
            <div class="control-group">
                <label>INPUT DATA (COMMA SEPARATED)</label>
                <div class="array-input-wrapper">
                    <input type="text" id="custom-array" class="brutal-input array-input-enhanced" placeholder="45, 12, 89, 33, 21">
                </div>
                <div class="btn-row" style="margin-top: 5px;">
                    <button id="btn-set-custom" class="brutal-btn">SET DATA</button>
                    <button id="btn-random" class="brutal-btn">RANDOMIZE</button>
                </div>
            </div>

            <div class="control-group">
                <label>RENDER MODE</label>
                <div class="btn-row">
                    <button id="btn-mode-bars" class="brutal-btn active-mode">BARS</button>
                    <button id="btn-mode-blocks" class="brutal-btn">BLOCKS</button>
                </div>
            </div>

            <div class="control-group">
                <label>SPEED DELAY</label>
                <input type="range" id="speed-slider" min="10" max="1000" value="100" class="brutal-range">
                <span id="speed-display" style="font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin-top: -5px;">100ms</span>
            </div>

            <div class="control-group" style="margin-top: 10px;">
                <label>EXECUTION CONTROLS</label>
                <select id="algo-select" class="brutal-input">
                    <option value="bubble">BUBBLE SORT</option>
                    <option value="selection">SELECTION SORT</option>
                    <option value="insertion">INSERTION SORT</option>
                    <option value="merge">MERGE SORT</option>
                </select>
                
                <button id="btn-start" class="brutal-btn primary" style="margin-top: 10px; width: 100%;">COMPUTE & START</button>
                
                <div class="playback-controls">
                    <button id="btn-prev" class="brutal-btn btn-playback" disabled>◄ STEP</button>
                    <button id="btn-pause" class="brutal-btn btn-playback" disabled>||</button>
                    <button id="btn-next" class="brutal-btn btn-playback" disabled>STEP ►</button>
                </div>
            </div>
        </div>

        <div class="bento-card viz-card">
            <div id="viz-container" class="viz-container"></div>
        </div>
    </main>

    <script src="js/visualizers/Visualizer.js"></script>
    <script src="js/app/app.js"></script>
</body>
</html>
